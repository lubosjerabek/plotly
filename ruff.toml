line-length = 120

[lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # Pyflakes — undefined names, unused imports
  "I",   # isort — import ordering
  "UP",  # pyupgrade — modernise syntax for target Python version
  "B",   # flake8-bugbear — likely bugs and design problems
  "C4",  # flake8-comprehensions — unnecessary comprehension constructs
  "SIM", # flake8-simplify — simplifiable code patterns
  "RUF", # Ruff-specific rules
]

# E501 line-too-long — tests have long assertion strings; exempt test files
[lint.per-file-ignores]
"tests/**" = ["E501"]
